name: Test

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify Flutter version floor
        uses: ./.github/actions/verify-flutter-floor
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install example dependencies for Android unit tests
        working-directory: example
        run: flutter pub get
      - name: Run Android plugin unit tests
        working-directory: example/android
        run: ./gradlew :mparticle_flutter_sdk:testDebugUnitTest
      - name: Cleanup
        if: ${{ always() }}
        run: |
          if command -v flutter &>/dev/null; then
            flutter clean
          fi
