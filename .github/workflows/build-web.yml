# Build Web
#
# Prerequisite: repository variable vars.FLUTTER_VERSION must be >= 3.44.0
# (matches pubspec minimum for Wasm-compatible interop).

name: Build Web

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  build-web:
    name: Build web flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify Flutter version floor (>= 3.44.0)
        run: |
          set -euo pipefail
          FLUTTER_VER=$(flutter --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Detected Flutter $FLUTTER_VER"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$FLUTTER_VER"
          if [ "$MAJOR" -lt 3 ] || { [ "$MAJOR" -eq 3 ] && [ "$MINOR" -lt 44 ]; }; then
            echo "Flutter $FLUTTER_VER is below required 3.44.0. Update vars.FLUTTER_VERSION."
            exit 1
          fi
      - name: Install plugin dependencies
        run: flutter pub get
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Test plugin (unit)
        run: flutter test
      - name: Test plugin identity callback (browser)
        run: flutter test --platform chrome test/identity_web_callback_test.dart
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Build example web (JS fallback)
        working-directory: example
        run: flutter build web
      - name: Verify JS web artifacts
        working-directory: example
        run: |
          set -e
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js || test -f build/web/flutter.js
      - name: Build example web (Wasm)
        working-directory: example
        run: flutter build web --wasm
      - name: Verify Wasm web artifacts
        working-directory: example
        run: |
          set -e
          test -f build/web/main.dart.wasm
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js || test -f build/web/flutter.js
      - name: Upload web build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-build-debug
          path: example/build/web/
      - name: Cleanup
        if: ${{ always() }}
        working-directory: example
        run: |
          rm -rf build
          if command -v flutter &>/dev/null; then
            flutter clean
          fi
